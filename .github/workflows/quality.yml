name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and WebKit for browser quality checks
        run: npx playwright install --with-deps chromium webkit

      - name: Run release quality gate
        run: npm run check:ci

      - name: Upload verified production build
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: chess-coach-production-${{ github.sha }}
          path: |
            dist
            quality-gate-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: chess-coach-quality-failure-${{ github.run_id }}
          path: |
            quality-gate-report.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
